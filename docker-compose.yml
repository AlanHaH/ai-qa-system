services:
  mysql:
    image: mysql:8.0
    container_name: ai_qa_mysql
    # 低内存服务器优化：调小缓冲池、关掉性能库，可省 300~500MB
    command:
      - --innodb-buffer-pool-size=128M
      - --innodb-buffer-pool-instances=1
      - --innodb-log-buffer-size=8M
      - --performance-schema=off
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ai_qa
      MYSQL_USER: ai_qa
      MYSQL_PASSWORD: aiqa123456
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: ai_qa_backend
    environment:
      DATABASE_URL: mysql+pymysql://ai_qa:aiqa123456@mysql:3306/ai_qa
      API_KEY: ${API_KEY}
      BASE_URL: ${BASE_URL}
      MODEL_NAME: ${MODEL_NAME}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
    volumes:
      - chroma_data:/app/chroma_db
      # embedding 模型缓存持久化（避免容器重建后从 S3 重新下载 79MB，国内 S3 极慢）
      - /root/chroma_model_cache:/root/.cache/chroma
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai_qa_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # ACME 证书验证目录（Let's Encrypt 自动续期用）
      - /opt/acme-challenge/.well-known:/usr/share/nginx/html/.well-known:ro
      # SSL 证书（acme.sh 签发，续期后自动更新）
      - /root/.acme.sh/aiyo.pw_ecc:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  mysql_data:
  chroma_data:
