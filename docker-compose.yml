services:
  mysql:
    image: mysql:8.0
    container_name: ai_qa_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ai_qa
      MYSQL_USER: ai_qa
      MYSQL_PASSWORD: aiqa123456
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: ai_qa_backend
    environment:
      DATABASE_URL: mysql+pymysql://ai_qa:aiqa123456@mysql:3306/ai_qa
      API_KEY: ${API_KEY}
      BASE_URL: ${BASE_URL}
      MODEL_NAME: ${MODEL_NAME}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
    volumes:
      - chroma_data:/app/chroma_db
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai_qa_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  mysql_data:
  chroma_data:
